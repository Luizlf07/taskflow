# Orquestracao local: sobe a aplicacao junto com sua dependencia (PostgreSQL).
# Um unico comando levanta o ambiente inteiro: docker compose up

services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    volumes:
      - dados-do-banco:/var/lib/postgresql/data
    # A aplicacao so sobe depois que este teste passar, evitando o erro de
    # conectar num banco que ainda esta inicializando.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taskflow} -d ${POSTGRES_DB:-taskflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  aplicacao:
    build: .
    init: true
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-taskflow}:${POSTGRES_PASSWORD}@banco:5432/${POSTGRES_DB:-taskflow}
    depends_on:
      banco:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dados-do-banco:
